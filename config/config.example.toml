# Platform driving this config: "android" (adb) or "ios" (WebDriverAgent).
platform = "android"
serial = "10AD4419NX0029Z"
# Namespaces this account's daily progress in runtime/task_state.db. Two
# Alipay accounts on one phone share the device serial, so each account
# needs its own value - otherwise the second run reads the first one's
# completed records and skips tasks. The run lock still covers the whole
# device, so the two accounts can never drive the phone at the same time.
account = ""
adb = "adb"
package = "com.eg.android.AlipayGphone"
# Used to distinguish your 520g watering record from other members' records.
forest_owner = ""
page_timeout = 25.0
run_timeout = 2400.0
max_scrolls = 16
max_reset_scrolls = 8
energy_sign_wait = 6.0
ad_entry_attempts = 2
quiz_option = 0
ffmpeg = "ffmpeg"
realtime_width = 720
realtime_bitrate = 8000000
realtime_start_timeout = 12.0
rain_countdown_seconds = 2.6
rain_duration_seconds = 22.0
rain_dedup_radius = 46
rain_touch_prediction = 0.08

# iOS profile (platform = "ios"): `serial` is the iPhone udid, `package` the
# iOS bundle id, and `wda_url` the reachable WebDriverAgent endpoint (USB
# port forward or Wi-Fi - verify the bundle id against the installed Alipay
# build during bring-up). See docs/ios_bringup.md for installing and
# forwarding the agent from a Windows/Linux host without a Mac.
# platform = "ios"
# serial = "00008030-XXXXXXXXXXXXXXXX"
# package = "com.alipay.iphoneclient"
# wda_url = "http://127.0.0.1:8100"
# wda_timeout = 10.0
