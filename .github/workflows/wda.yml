# One-time WebDriverAgent build on a macOS runner: iOS has no public touch
# injection API, and building WDA is the only step that needs macOS - the
# daily run drives the phone from Windows/WSL2 over WDA's REST protocol.
# The result is an UNSIGNED ipa published as a public release asset; sign
# and install it from Windows with Sideloadly/AltStore
# (docs/ios_bringup.md §2). Free Apple ID signatures expire after 7 days -
# re-sign, or rerun this workflow only when the WDA build itself needs
# updating. Pushing a change to this file triggers a build automatically;
# manual runs stay available via workflow_dispatch. On failure each stage's
# captured log is pushed to ci/wda/ on the running branch so it can be read
# without Actions log access.
name: wda

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "WDA repository (the appium fork tracks new Xcode/iOS)"
        default: "appium/WebDriverAgent"
        required: true
      ref:
        description: "branch / tag / commit (appium/WebDriverAgent uses master)"
        default: "master"
        required: true
  push:
    paths:
      - ".github/workflows/wda.yml"

permissions:
  contents: write

jobs:
  build-wda:
    runs-on: macos-latest
    env:
      WDA_REPOSITORY: ${{ inputs.repository || 'appium/WebDriverAgent' }}
      WDA_REF: ${{ inputs.ref || 'master' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WDA_REPOSITORY }}
          ref: ${{ env.WDA_REF }}

      - name: Select Xcode
        run: |
          # The newest installed Xcode; WDA follows the SDK it is built against.
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version 2>&1 | tee ci-xcode-log.txt

      - name: List schemes and targets
        # Wrong scheme names fail here with a tiny log instead of deep inside
        # a multi-minute archive.
        run: |
          set -o pipefail
          xcodebuild -list -project WebDriverAgent.xcodeproj 2>&1 | tee ci-project-log.txt

      - name: Archive unsigned WDA
        run: |
          set -o pipefail
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -archivePath build/wda.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ci-archive-log.txt

      - name: Pack unsigned ipa
        # The archive's install phase leaves Products/ empty (SKIP_INSTALL on
        # the runner), but the fully built app lands under the archive
        # intermediates - take the shallowest .app under build/ whatever
        # layout the current Xcode produces. The runner shell runs with
        # bash -e, so every pipeline fully consumes its input (sed instead
        # of head - no SIGPIPE) and failures are explicit, with the exit
        # code appended to the log via trap.
        run: |
          set -o pipefail
          trap 'echo "pack exited rc=$?" | tee -a ci-pack-log.txt' EXIT
          {
            echo "== .app candidates under build/ =="
            find build -name '*.app' 2>/dev/null | sed -n '1,100p'
          } | tee ci-pack-log.txt
          APP=$(find build -name '*.app' 2>/dev/null \
            | awk -F/ '{print NF"\t"$0}' | sort -n | sed -n '1p' | cut -f2) || APP=""
          echo "Selected runner app: ${APP:-<none>}" | tee -a ci-pack-log.txt
          if [ -z "$APP" ]; then
            echo "no .app product found under build/" | tee -a ci-pack-log.txt
            exit 1
          fi
          mkdir -p build/Payload
          if ! cp -R "$APP" build/Payload/; then
            echo "copying the runner app into Payload failed" | tee -a ci-pack-log.txt
            exit 1
          fi
          if ! (cd build && zip -qry wda-unsigned.ipa Payload); then
            echo "zipping Payload failed" | tee -a ci-pack-log.txt
            exit 1
          fi
          ls -la build/wda-unsigned.ipa | tee -a ci-pack-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wda-unsigned-ipa
          path: build/wda-unsigned.ipa
          if-no-files-found: error

      - name: Publish a public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "wda-run-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --title "WDA unsigned build: ${WDA_REPOSITORY}@${WDA_REF} (run ${{ github.run_number }})" \
            --notes "Unsigned WebDriverAgent ipa built from ${WDA_REPOSITORY}@${WDA_REF}. Sign and install from Windows with Sideloadly/AltStore (docs/ios_bringup.md §2); free Apple ID signatures last 7 days." \
            --prerelease \
            build/wda-unsigned.ipa

      - name: Push stage logs to ci/wda/ on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actions run logs need repo admin; pushing the captured stage logs
          # keeps failures readable over raw.githubusercontent.com instead.
          # Updating an existing file via the contents API requires its
          # current sha, otherwise every PUT 422s.
          pushed=0
          for f in ci-xcode-log.txt ci-project-log.txt ci-archive-log.txt ci-pack-log.txt; do
            [ -f "$f" ] || continue
            tail -c 200000 "$f" > ci-capped.txt
            SHA=$(gh api "repos/${{ github.repository }}/contents/ci/wda/$f?ref=${{ github.ref_name }}" --jq '.sha' 2>/dev/null || true)
            ARGS=(-f message="wda: $f from failed run ${{ github.run_number }}"
                  -f content="$(base64 -i ci-capped.txt | tr -d '\n')"
                  -f branch="${{ github.ref_name }}")
            [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
            if gh api -X PUT "repos/${{ github.repository }}/contents/ci/wda/$f" "${ARGS[@]}" >/dev/null; then
              pushed=1
            else
              echo "could not push $f"
            fi
          done
          if [ "$pushed" = "0" ]; then
            echo "no stage logs were pushed"
          fi
