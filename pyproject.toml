[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ants-auto"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "rapidocr-onnxruntime>=1.3.19,<2", "av>=13"]

[project.scripts]
ants-auto = "runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
